[package]
name = "boogeyman"
version = "0.1.0"
description = "The Boogeyman: personal desktop AI assistant"
authors = ["Umah"]
license = ""
repository = "https://github.com/Hidden-Umah/TheBoogieMan"
edition = "2024"
rust-version = "1.90"

[lib]
name = "boogeyman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["process", "sync", "time", "net", "macros", "io-util"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.37"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
